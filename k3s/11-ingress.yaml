# ==============================================================================
# Traefik Ingress (built-in K3s) -> api-gateway:8080
#   - api-gateway da xu ly ca /api/v1/**, /bidding-socket/**,
#     /notification-socket/** (WebSocket) va catch-all /** -> web-portal:3000.
#   - Mac dinh khong gan host de truy cap thang bang http://<EC2_PUBLIC_IP>.
#   - Khi co domain, dat INGRESS_HOST trong .env.k3s hoac dung 11-ingress-tls.yaml.example.
# ==============================================================================
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: backhaulbid-ingress
  namespace: backhaulbid
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 8080
