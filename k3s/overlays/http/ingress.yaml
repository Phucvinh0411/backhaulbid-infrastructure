# ==============================================================================
# Traefik Ingress (built-in K3s) - Phan luong truc tiep tai edge:
#   - /api/v1/**, WebSocket (/bidding-socket, /notification-socket),
#     Swagger (/v3/api-docs, /swagger-ui, /swagger-ui.html, /webjars) -> api-gateway:8080
#   - Web Portal (/, /_next/**, /api/auth/**, /api/bidding/**, static) -> web-portal:3000
# ==============================================================================
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: backhaulbid-ingress
  namespace: backhaulbid
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /api/v1
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 8080
          - path: /bidding-socket
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 8080
          - path: /notification-socket
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 8080
          - path: /v3/api-docs
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 8080
          - path: /swagger-ui.html
            pathType: Exact
            backend:
              service:
                name: api-gateway
                port:
                  number: 8080
          - path: /swagger-ui
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 8080
          - path: /webjars
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 8080
          - path: /actuator/health
            pathType: Exact
            backend:
              service:
                name: api-gateway
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web-portal
                port:
                  number: 3000
