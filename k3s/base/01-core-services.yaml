# ==============================================================================
# Core Spring Boot Microservices:
#   1. identity-service
#   2. fleet-service
#   3. wallet-service
#   4. contract-service
#   5. media-service
# ==============================================================================

apiVersion: v1
kind: Service
metadata:
  name: identity-service
  namespace: backhaulbid
spec:
  selector:
    app: identity-service
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: identity-service
  namespace: backhaulbid
spec:
  replicas: 2
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: identity-service
  template:
    metadata:
      labels:
        app: identity-service
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 35
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
      containers:
        - name: identity-service
          image: backhaulbid/identity-service:v1
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: JAVA_OPTS
              value: "-Xms64m -Xmx256m"
            - name: SERVER_PORT
              value: "8080"
            - name: SERVER_SHUTDOWN
              valueFrom:
                configMapKeyRef:
                  name: backhaulbid-config
                  key: SERVER_SHUTDOWN
            - name: SPRING_JPA_SHOW_SQL
              valueFrom:
                configMapKeyRef:
                  name: backhaulbid-config
                  key: SPRING_JPA_SHOW_SQL
            - name: DB_URL
              valueFrom:
                configMapKeyRef:
                  name: backhaulbid-config
                  key: POSTGRES_IDENTITY_URL
            - name: DB_USERNAME
              valueFrom:
                configMapKeyRef:
                  name: backhaulbid-config
                  key: POSTGRES_IDENTITY_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: backhaulbid-secrets
                  key: POSTGRES_IDENTITY_PASSWORD
            - name: DB_POOL_MAX_SIZE
              valueFrom:
                configMapKeyRef:
                  name: backhaulbid-config
                  key: DB_POOL_MAX_SIZE
            - name: DB_POOL_MIN_IDLE
              valueFrom:
                configMapKeyRef:
                  name: backhaulbid-config
                  key: DB_POOL_MIN_IDLE
            - name: EUREKA_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: backhaulbid-config
                  key: EUREKA_ENABLED
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: backhaulbid-secrets
                  key: JWT_SECRET
            - name: SPRING_FLYWAY_LOCATIONS
              valueFrom:
                configMapKeyRef:
                  name: backhaulbid-config
                  key: IDENTITY_FLYWAY_LOCATIONS
            - name: SWAGGER_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: backhaulbid-config
                  key: SWAGGER_ENABLED
            - name: NFC_EKYC_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: backhaulbid-config
                  key: NFC_EKYC_ENABLED
            - name: EKYC_AUTO_ACCEPT
              valueFrom:
                configMapKeyRef:
                  name: backhaulbid-config
                  key: EKYC_AUTO_ACCEPT
            - name: SPRING_PROFILES_ACTIVE
              valueFrom:
                configMapKeyRef:
                  name: backhaulbid-config
                  key: IDENTITY_SPRING_PROFILES_ACTIVE
            - name: EKYC_EVIDENCE_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: backhaulbid-secrets
                  key: EKYC_EVIDENCE_ENCRYPTION_KEY
            - name: BUSINESS_LOOKUP_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: backhaulbid-secrets
                  key: BUSINESS_LOOKUP_CLIENT_ID
            - name: BUSINESS_LOOKUP_API_KEY
              valueFrom:
                secretKeyRef:
                  name: backhaulbid-secrets
                  key: BUSINESS_LOOKUP_API_KEY
            - name: MEDIA_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: backhaulbid-config
                  key: MEDIA_SERVICE_URL
            - name: CONTRACT_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: backhaulbid-config
                  key: CONTRACT_SERVICE_URL
            - name: INTERNAL_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: backhaulbid-secrets
                  key: INTERNAL_SERVICE_TOKEN
            - name: DRIVER_REPLAY_KEY
              valueFrom:
                secretKeyRef:
                  name: backhaulbid-secrets
                  key: DRIVER_REPLAY_KEY
            - name: GOOGLE_CLIENT_ID
              valueFrom:
                configMapKeyRef:
                  name: backhaulbid-config
                  key: GOOGLE_CLIENT_ID
          resources:
            requests:
              cpu: 50m
              memory: 224Mi
            limits:
              cpu: 1000m
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            periodSeconds: 20
            timeoutSeconds: 5
---
