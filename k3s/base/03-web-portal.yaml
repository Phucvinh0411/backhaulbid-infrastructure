apiVersion: v1
kind: Service
metadata:
  name: web-portal
  namespace: backhaulbid
spec:
  selector:
    app: web-portal
  ports:
    - name: http
      port: 3000
      targetPort: 3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-portal
  namespace: backhaulbid
spec:
  replicas: 2
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: web-portal
  template:
    metadata:
      labels:
        app: web-portal
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        - name: next-cache
          emptyDir:
            sizeLimit: 128Mi
      containers:
        - name: web-portal
          image: backhaulbid/web-portal:v1
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: next-cache
              mountPath: /app/.next/cache
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: INTERNAL_GATEWAY_URL
              valueFrom:
                configMapKeyRef:
                  name: backhaulbid-config
                  key: INTERNAL_GATEWAY_URL
            - name: NEXT_PUBLIC_GATEWAY_URL
              valueFrom:
                configMapKeyRef:
                  name: backhaulbid-config
                  key: NEXT_PUBLIC_GATEWAY_URL
            - name: NEXT_PUBLIC_BIDDING_SOCKET_PATH
              valueFrom:
                configMapKeyRef:
                  name: backhaulbid-config
                  key: NEXT_PUBLIC_BIDDING_SOCKET_PATH
            - name: COOKIE_SECURE
              valueFrom:
                configMapKeyRef:
                  name: backhaulbid-config
                  key: COOKIE_SECURE
            - name: GOOGLE_CLIENT_ID
              valueFrom:
                configMapKeyRef:
                  name: backhaulbid-config
                  key: GOOGLE_CLIENT_ID
            - name: NEXT_PUBLIC_GOOGLE_CLIENT_ID
              valueFrom:
                configMapKeyRef:
                  name: backhaulbid-config
                  key: GOOGLE_CLIENT_ID
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 400m
              memory: 320Mi
          startupProbe:
            httpGet:
              path: /login
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /login
              port: 3000
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /login
              port: 3000
            periodSeconds: 20
            timeoutSeconds: 5
