apiVersion: v1
kind: ConfigMap
metadata:
  name: backhaulbid-config
  namespace: backhaulbid
data:
  # Database & Broker non-secret settings (K8s Service DNS)
  POSTGRES_USER: "backhaulbid"
  POSTGRES_DB: "backhaulbid_identity"
  POSTGRES_IDENTITY_URL: "jdbc:postgresql://postgres:5432/backhaulbid_identity"
  POSTGRES_FLEET_URL: "jdbc:postgresql://postgres:5432/backhaulbid_fleet"
  POSTGRES_WALLET_URL: "jdbc:postgresql://postgres:5432/backhaulbid_wallet"
  POSTGRES_CONTRACT_URL: "jdbc:postgresql://postgres:5432/backhaulbid_contract"

  MONGO_USER: "backhaulbid"
  MONGO_HOST: "mongodb"
  MONGO_PORT: "27017"
  MONGO_BIDDING_DATABASE: "backhaulbid_bidding"
  MONGO_NOTIFICATION_DATABASE: "backhaulbid_notification"

  REDIS_HOST: "redis"
  REDIS_PORT: "6379"

  RABBITMQ_USER: "backhaulbid"
  RABBITMQ_HOST: "rabbitmq"
  RABBITMQ_PORT: "5672"

  # Service discovery & internal service URLs
  EUREKA_URL: "http://eureka-server:8761/eureka/"
  INTERNAL_GATEWAY_URL: "http://api-gateway:8080"
  IDENTITY_SERVICE_URL: "http://identity-service:8080"
  FLEET_SERVICE_URL: "http://fleet-service:8080"
  WALLET_SERVICE_URL: "http://wallet-service:8080"
  CONTRACT_SERVICE_URL: "http://contract-service:8080"
  MEDIA_SERVICE_URL: "http://media-service:8080"
  NOTIFICATION_SERVICE_URL: "http://notification-service:3002"

  # Public URL, CORS & Web Portal settings (updated automatically by scripts/deploy.sh)
  NEXT_PUBLIC_GATEWAY_URL: "http://localhost:8080"
  NEXT_PUBLIC_BIDDING_SOCKET_PATH: "/bidding-socket"
  COOKIE_SECURE: "false"
  FRONTEND_ORIGIN: "http://localhost:8080"
  FRONTEND_LAN_ORIGIN: "http://localhost:3000"
  EXPO_WEB_ORIGIN: "http://localhost:3002"
  EXPO_LAN_ORIGIN: "http://localhost:3002"

  # Spring Boot & OpenAPI settings
  SWAGGER_ENABLED: "false"
  OPENAPI_GATEWAY_SERVER_URL: "/api/v1/bidding"
  OPENAPI_DIRECT_SERVER_URL: "http://bidding-service:3001"
  IDENTITY_FLYWAY_LOCATIONS: "classpath:db/migration"
  SPRING_JPA_SHOW_SQL: "false"
  SERVER_SHUTDOWN: "graceful"

  # AWS S3 (non-secret)
  AWS_REGION: "ap-southeast-1"
  AWS_S3_BUCKET: "backhaulbid-s3"

  # Mail (non-secret)
  CONTRACT_OTP_MAIL_ENABLED: "true"
  MAIL_HOST: "smtp-relay.brevo.com"
  MAIL_PORT: "587"
  MAIL_FROM: "no-reply@backhaulbid.vn"
  MAIL_FROM_NAME: "BackhaulBid"
  MAIL_SMTP_AUTH: "true"
  MAIL_SMTP_STARTTLS: "true"

  # SePay (non-secret)
  SEPAY_ENABLED: "false"
  SEPAY_CHECKOUT_URL: "https://pay-sandbox.sepay.vn/v1/checkout/init"
  SEPAY_SUCCESS_URL: "http://localhost:8080/carrier/wallet?payment=success"
  SEPAY_ERROR_URL: "http://localhost:8080/carrier/wallet?payment=error"
  SEPAY_CANCEL_URL: "http://localhost:8080/carrier/wallet?payment=cancel"

  # Optional integrations (non-secret)
  GOOGLE_CLIENT_ID: ""
  NFC_EKYC_ENABLED: "false"
  EKYC_AUTO_ACCEPT: "DISABLED"
  ROUTING_BASE_URL: "https://router.project-osrm.org"
