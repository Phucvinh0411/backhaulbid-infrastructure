apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: backhaulbid
spec:
  selector:
    app: api-gateway
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: backhaulbid
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: backhaulbid/api-gateway:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: JAVA_TOOL_OPTIONS
              value: "-Xms64m -Xmx256m"
            - name: SERVER_PORT
              value: "8080"
            - name: SERVER_SHUTDOWN
              valueFrom:
                configMapKeyRef:
                  name: backhaulbid-config
                  key: SERVER_SHUTDOWN
            - name: EUREKA_URL
              valueFrom:
                configMapKeyRef:
                  name: backhaulbid-config
                  key: EUREKA_URL
            - name: FRONTEND_ORIGIN
              valueFrom:
                configMapKeyRef:
                  name: backhaulbid-config
                  key: FRONTEND_ORIGIN
            - name: FRONTEND_LAN_ORIGIN
              valueFrom:
                configMapKeyRef:
                  name: backhaulbid-config
                  key: FRONTEND_LAN_ORIGIN
            - name: EXPO_WEB_ORIGIN
              valueFrom:
                configMapKeyRef:
                  name: backhaulbid-config
                  key: EXPO_WEB_ORIGIN
            - name: EXPO_LAN_ORIGIN
              valueFrom:
                configMapKeyRef:
                  name: backhaulbid-config
                  key: EXPO_LAN_ORIGIN
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: backhaulbid-secrets
                  key: JWT_SECRET
            - name: SWAGGER_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: backhaulbid-config
                  key: SWAGGER_ENABLED
            - name: REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: backhaulbid-config
                  key: REDIS_HOST
            - name: REDIS_PORT
              valueFrom:
                configMapKeyRef:
                  name: backhaulbid-config
                  key: REDIS_PORT
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: backhaulbid-secrets
                  key: REDIS_PASSWORD
          resources:
            requests:
              cpu: 50m
              memory: 224Mi
            limits:
              cpu: 1000m
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 36
          # /actuator/health chi tra UP sau khi 4 core services da dang ky tren Eureka
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            periodSeconds: 20
            timeoutSeconds: 5
