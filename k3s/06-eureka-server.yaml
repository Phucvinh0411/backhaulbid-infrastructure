apiVersion: v1
kind: Service
metadata:
  name: eureka-server
  namespace: backhaulbid
spec:
  selector:
    app: eureka-server
  ports:
    - name: http
      port: 8761
      targetPort: 8761
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: eureka-server
  namespace: backhaulbid
spec:
  replicas: 1
  selector:
    matchLabels:
      app: eureka-server
  template:
    metadata:
      labels:
        app: eureka-server
    spec:
      containers:
        - name: eureka-server
          image: backhaulbid/eureka-server:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8761
              name: http
          env:
            - name: SERVER_PORT
              value: "8761"
            - name: JAVA_TOOL_OPTIONS
              value: "-Xms128m -Xmx256m"
            - name: SERVER_SHUTDOWN
              valueFrom:
                configMapKeyRef:
                  name: backhaulbid-config
                  key: SERVER_SHUTDOWN
          resources:
            requests:
              cpu: 50m
              memory: 192Mi
            limits:
              cpu: 800m
              memory: 448Mi
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8761
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8761
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8761
            periodSeconds: 20
            timeoutSeconds: 5
