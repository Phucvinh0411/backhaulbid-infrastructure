name: backhaulbid

services:
  postgres:
    image: postgres:16-alpine
    container_name: backhaulbid-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-backhaulbid}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-backhaulbid_identity}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts/postgres:/docker-entrypoint-initdb.d:ro
    networks:
      - backhaulbid-network
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  mongodb:
    image: mongo:7.0
    container_name: backhaulbid-mongodb
    restart: unless-stopped
    ports:
      - "${MONGO_HOST_PORT:-27017}:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-backhaulbid}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?MONGO_PASSWORD is required}
      MONGO_INITDB_DATABASE: ${MONGO_BIDDING_DATABASE:-backhaulbid_bidding}
    volumes:
      - mongodb_data:/data/db
      # Load the shared bidding fixtures when MongoDB initializes a new volume.
      - ../backhaulbid-demo-data/mongo/seed-bidding.js:/docker-entrypoint-initdb.d/01-seed-bidding.js:ro
    networks:
      - backhaulbid-network
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 384M
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s

  redis:
    image: redis:7-alpine
    container_name: backhaulbid-redis
    restart: unless-stopped
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD is required}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    volumes:
      - redis_data:/data
    networks:
      - backhaulbid-network
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 64M
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD:?REDIS_PASSWORD is required}\" ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: backhaulbid-rabbitmq
    restart: unless-stopped
    ports:
      - "${RABBITMQ_HOST_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_HOST_PORT:-15672}:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-backhaulbid}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - backhaulbid-network
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  eureka-server:
    build:
      context: ./eureka-server
    container_name: backhaulbid-eureka-server
    restart: unless-stopped
    ports:
      - "${EUREKA_HOST_PORT:-8761}:8761"
    networks:
      - backhaulbid-network
    environment:
      JAVA_OPTS: -Xms64m -Xmx192m
    deploy:
      resources:
        limits:
          cpus: '0.30'
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8761/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s

  identity-service:
    build:
      context: ../backhaulbid-core-services
      args:
        MODULE: identity-service
    container_name: backhaulbid-identity-service
    restart: unless-stopped
    # Không expose port ra ngoài - chỉ giao tiếp qua internal Docker network
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 384M
    environment:
      JAVA_OPTS: -Xms64m -Xmx256m
      SERVER_PORT: 8080
      DB_URL: ${POSTGRES_IDENTITY_URL:-jdbc:postgresql://postgres:5432/backhaulbid_identity}
      DB_USERNAME: ${POSTGRES_USER:-backhaulbid}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      EUREKA_URL: ${EUREKA_URL:-http://eureka-server:8761/eureka/}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      SPRING_FLYWAY_LOCATIONS: classpath:db/migration,classpath:db/dev-migration
      BUSINESS_VERIFICATION_UPLOAD_DIR: /data/business-verifications
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}
    volumes:
      - business_verification_uploads:/data/business-verifications
    depends_on:
      postgres:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    networks:
      - backhaulbid-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  fleet-service:
    build:
      context: ../backhaulbid-core-services
      args:
        MODULE: fleet-service
    container_name: backhaulbid-fleet-service
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 384M
    environment:
      JAVA_OPTS: -Xms64m -Xmx256m
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: ${POSTGRES_FLEET_URL:-jdbc:postgresql://postgres:5432/backhaulbid_fleet}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-backhaulbid}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      EUREKA_URL: ${EUREKA_URL:-http://eureka-server:8761/eureka/}
      FLEET_UPLOAD_DIR: /data/fleet-documents
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}
    volumes:
      - fleet_document_uploads:/data/fleet-documents
    depends_on:
      postgres:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    networks:
      - backhaulbid-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  wallet-service:
    build:
      context: ../backhaulbid-core-services
      args:
        MODULE: wallet-service
    container_name: backhaulbid-wallet-service
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 384M
    environment:
      JAVA_OPTS: -Xms64m -Xmx256m
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: ${POSTGRES_WALLET_URL:-jdbc:postgresql://postgres:5432/backhaulbid_wallet}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-backhaulbid}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      EUREKA_URL: ${EUREKA_URL:-http://eureka-server:8761/eureka/}
      INTERNAL_WALLET_TOKEN: ${INTERNAL_WALLET_TOKEN:?INTERNAL_WALLET_TOKEN is required}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}
      SEPAY_ENABLED: ${SEPAY_ENABLED:-false}
      SEPAY_MERCHANT_ID: ${SEPAY_MERCHANT_ID:-}
      SEPAY_SECRET_KEY: ${SEPAY_SECRET_KEY:-}
      SEPAY_IPN_SECRET: ${SEPAY_IPN_SECRET:-}
      SEPAY_CHECKOUT_URL: ${SEPAY_CHECKOUT_URL:-https://pay-sandbox.sepay.vn/v1/checkout/init}
      SEPAY_SUCCESS_URL: ${SEPAY_SUCCESS_URL:-http://localhost:8080/carrier/wallet?payment=success}
      SEPAY_ERROR_URL: ${SEPAY_ERROR_URL:-http://localhost:8080/carrier/wallet?payment=error}
      SEPAY_CANCEL_URL: ${SEPAY_CANCEL_URL:-http://localhost:8080/carrier/wallet?payment=cancel}
    depends_on:
      postgres:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    networks:
      - backhaulbid-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  contract-service:
    build:
      context: ../backhaulbid-core-services
      args:
        MODULE: contract-service
    container_name: backhaulbid-contract-service
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 384M
    environment:
      JAVA_OPTS: -Xms64m -Xmx256m
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: ${POSTGRES_CONTRACT_URL:-jdbc:postgresql://postgres:5432/backhaulbid_contract}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-backhaulbid}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      EUREKA_URL: ${EUREKA_URL:-http://eureka-server:8761/eureka/}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}
    depends_on:
      postgres:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    networks:
      - backhaulbid-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

