name: backhaulbid

services:
  postgres:
    image: postgres:16-alpine
    container_name: backhaulbid-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-backhaulbid}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-backhaulbid_secret}
      POSTGRES_DB: backhaulbid_identity
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts/postgres:/docker-entrypoint-initdb.d:ro
    networks:
      - backhaulbid-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  mongodb:
    image: mongo:7.0
    container_name: backhaulbid-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-backhaulbid}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-backhaulbid_secret}
      MONGO_INITDB_DATABASE: backhaulbid_bidding
    volumes:
      - mongodb_data:/data/db
    networks:
      - backhaulbid-network
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: backhaulbid-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-backhaulbid_secret}"]
    volumes:
      - redis_data:/data
    networks:
      - backhaulbid-network
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD:-backhaulbid_secret}\" ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: backhaulbid-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-backhaulbid}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-backhaulbid_secret}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - backhaulbid-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  eureka-server:
    build:
      context: ./eureka-server
    container_name: backhaulbid-eureka-server
    restart: unless-stopped
    ports:
      - "8761:8761"
    networks:
      - backhaulbid-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8761/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s

  identity-service:
    build:
      context: ../backhaulbid-core-services
      args:
        MODULE: identity-service
    container_name: backhaulbid-identity-service
    restart: unless-stopped
    ports:
      - "8081:8080"
    environment:
      SERVER_PORT: 8080
      DB_URL: jdbc:postgresql://postgres:5432/backhaulbid_identity
      DB_USERNAME: ${POSTGRES_USER:-backhaulbid}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-backhaulbid_secret}
      EUREKA_URL: http://eureka-server:8761/eureka/
      JWT_SECRET: ${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      SPRING_FLYWAY_LOCATIONS: classpath:db/migration,classpath:db/dev-migration
      BUSINESS_VERIFICATION_UPLOAD_DIR: /data/business-verifications
      SWAGGER_ENABLED: "true"
    volumes:
      - business_verification_uploads:/data/business-verifications
    depends_on:
      postgres:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    networks:
      - backhaulbid-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  fleet-service:
    build:
      context: ../backhaulbid-core-services
      args:
        MODULE: fleet-service
    container_name: backhaulbid-fleet-service
    restart: unless-stopped
    ports:
      - "8082:8080"
    environment:
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/backhaulbid_fleet
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-backhaulbid}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-backhaulbid_secret}
      EUREKA_URL: http://eureka-server:8761/eureka/
      SWAGGER_ENABLED: "true"
    depends_on:
      postgres:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    networks:
      - backhaulbid-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  wallet-service:
    build:
      context: ../backhaulbid-core-services
      args:
        MODULE: wallet-service
    container_name: backhaulbid-wallet-service
    restart: unless-stopped
    ports:
      - "8083:8080"
    environment:
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/backhaulbid_wallet
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-backhaulbid}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-backhaulbid_secret}
      EUREKA_URL: http://eureka-server:8761/eureka/
      SWAGGER_ENABLED: "true"
    depends_on:
      postgres:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    networks:
      - backhaulbid-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  contract-service:
    build:
      context: ../backhaulbid-core-services
      args:
        MODULE: contract-service
    container_name: backhaulbid-contract-service
    restart: unless-stopped
    ports:
      - "8084:8080"
    environment:
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/backhaulbid_contract
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-backhaulbid}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-backhaulbid_secret}
      EUREKA_URL: http://eureka-server:8761/eureka/
      SWAGGER_ENABLED: "true"
    depends_on:
      postgres:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    networks:
      - backhaulbid-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  notification-service:
    build:
      context: ../backhaulbid-core-services
      args:
        MODULE: notification-service
    container_name: backhaulbid-notification-service
    restart: unless-stopped
    ports:
      - "8085:8080"
    environment:
      SERVER_PORT: 8080
      MONGO_URI: mongodb://${MONGO_USER:-backhaulbid}:${MONGO_PASSWORD:-backhaulbid_secret}@mongodb:27017/backhaulbid_notification?authSource=admin
      EUREKA_URL: http://eureka-server:8761/eureka/
      SWAGGER_ENABLED: "true"
    depends_on:
      mongodb:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    networks:
      - backhaulbid-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  bidding-service:
    build:
      context: ../backhaulbid-bidding-service
    container_name: backhaulbid-bidding-service
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      MONGO_URI: mongodb://${MONGO_USER:-backhaulbid}:${MONGO_PASSWORD:-backhaulbid_secret}@mongodb:27017/backhaulbid_bidding?authSource=admin
      REDIS_URL: redis://:${REDIS_PASSWORD:-backhaulbid_secret}@redis:6379
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-backhaulbid}:${RABBITMQ_PASSWORD:-backhaulbid_secret}@rabbitmq:5672
      SWAGGER_ENABLED: "true"
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - backhaulbid-network

  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: backhaulbid-api-gateway
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SERVER_PORT: 8080
      EUREKA_URL: http://eureka-server:8761/eureka/
      FRONTEND_ORIGIN: http://localhost:3000
      JWT_SECRET: ${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      SWAGGER_ENABLED: "true"
    depends_on:
      eureka-server:
        condition: service_healthy
      identity-service:
        condition: service_healthy
      fleet-service:
        condition: service_healthy
      wallet-service:
        condition: service_healthy
      contract-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
      bidding-service:
        condition: service_started
    networks:
      - backhaulbid-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s

  web-portal:
    profiles:
      - frontend
    build:
      context: ../../fe/backhaulbid-web-portal
      args:
        NEXT_PUBLIC_GATEWAY_URL: http://localhost:8080
    container_name: backhaulbid-web-portal
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      INTERNAL_GATEWAY_URL: http://api-gateway:8080
      NEXT_PUBLIC_GATEWAY_URL: http://localhost:8080
      COOKIE_SECURE: "false"
    depends_on:
      api-gateway:
        condition: service_healthy
    networks:
      - backhaulbid-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/login >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s

volumes:
  postgres_data:
  mongodb_data:
  redis_data:
  rabbitmq_data:
  business_verification_uploads:

networks:
  backhaulbid-network:
    name: backhaulbid-network
    driver: bridge
