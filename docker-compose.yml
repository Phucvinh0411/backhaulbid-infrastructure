  bidding-service:
    build:
      context: ../backhaulbid-bidding-service
    container_name: backhaulbid-bidding-service
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M
    environment:
      PORT: 3001
      MONGO_URI: mongodb://${MONGO_USER:-backhaulbid}:${MONGO_PASSWORD:?MONGO_PASSWORD is required}@${MONGO_HOST:-mongodb}:${MONGO_PORT:-27017}/${MONGO_BIDDING_DATABASE:-backhaulbid_bidding}?authSource=admin
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@${REDIS_HOST:-redis}:${REDIS_PORT:-6379}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-backhaulbid}:${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}@${RABBITMQ_HOST:-rabbitmq}:${RABBITMQ_PORT:-5672}
      WALLET_SERVICE_URL: ${WALLET_SERVICE_URL:-http://wallet-service:8080}
      INTERNAL_WALLET_TOKEN: ${INTERNAL_WALLET_TOKEN:?INTERNAL_WALLET_TOKEN is required}
      OPENAPI_GATEWAY_SERVER_URL: ${OPENAPI_GATEWAY_SERVER_URL:-http://localhost:8080}
      OPENAPI_DIRECT_SERVER_URL: ${OPENAPI_DIRECT_SERVER_URL:-http://localhost:3001}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - backhaulbid-network

  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: backhaulbid-api-gateway
    restart: unless-stopped
    ports:
      - "${API_GATEWAY_HOST_PORT:-8080}:8080"
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 384M
    environment:
      JAVA_OPTS: -Xms64m -Xmx256m
      SERVER_PORT: 8080
      EUREKA_URL: ${EUREKA_URL:-http://eureka-server:8761/eureka/}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:3000}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}
    depends_on:
      eureka-server:
        condition: service_healthy
      identity-service:
        condition: service_healthy
      fleet-service:
        condition: service_healthy
      wallet-service:
        condition: service_healthy
      contract-service:
        condition: service_healthy
#      notification-service:
#        condition: service_healthy
      bidding-service:
        condition: service_started
    networks:
      - backhaulbid-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s

  web-portal:
    build:
      context: ../backhaulbid-web-portal
      dockerfile: Dockerfile
    container_name: backhaulbid-web-portal
    restart: unless-stopped
    # Không expose port - truy cập qua api-gateway:8080
    deploy:
      resources:
        limits:
          cpus: '0.30'
          memory: 256M
    environment:
      - INTERNAL_GATEWAY_URL=${INTERNAL_GATEWAY_URL:-http://api-gateway:8080}
      - NEXT_PUBLIC_GATEWAY_URL=${NEXT_PUBLIC_GATEWAY_URL:-http://localhost:8080}
    depends_on:
      api-gateway:
        condition: service_healthy
    networks:
      - backhaulbid-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/login >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s

# ──────────────────────────────────────────
# Volumes
# ──────────────────────────────────────────
volumes:
  postgres_data:
  mongodb_data:
  redis_data:
  rabbitmq_data:
  business_verification_uploads:
  fleet_document_uploads:

networks:
  backhaulbid-network:
    name: backhaulbid-network
    driver: bridge
